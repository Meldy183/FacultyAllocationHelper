openapi: 3.0.0
info:
  title: Profile Service API
  description: API for managing faculty profiles, courses, and filters
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.example.com
    description: Production server

paths:
  /profile/addProfile:
    post:
      tags:
        - Faculty Profile
      summary: Add a new faculty profile
      description: Create a new faculty profile with position and associated institutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProfileRequest'
            example:
              name_eng: "John Doe"
              email: "j.doe@university.edu"
              alias: "jdoe"
              institute_id: [1, 2]
              position_id: 1
              year: 2024
      responses:
        '200':
          description: Profile successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddProfileResponse'
              example:
                profile_id: 1
                name_eng: "John Doe"
                email: "j.doe@university.edu"
                alias: "jdoe"
                institute_names: ["Институт анализа данных и Искусственного Интеллекта", "Институт разработки ПО и программной инженерии"]
                position_name: "Professor"
                year: 2024
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /profile/getProfile/{id}:
    get:
      tags:
        - Faculty Profile
      summary: Get faculty profile by version ID
      description: Retrieve detailed information about a faculty profile including workload statistics
      parameters:
        - name: id
          in: path
          required: true
          description: Profile version ID (must be > 0)
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        '200':
          description: Profile found and retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProfileResponse'
        '400':
          description: Invalid profile ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /profile/getAllProfiles:
    get:
      tags:
        - Faculty Profile
      summary: Get all faculty profiles with filters
      description: Retrieve a list of faculty profiles filtered by institute and position
      parameters:
        - name: institute
          in: query
          description: "Institute IDs to filter by (valid values: 1-5)"
          schema:
            type: array
            items:
              type: integer
              format: int64
              minimum: 1
              maximum: 5
          example: [1, 2]
        - name: position
          in: query
          description: "Position IDs to filter by (valid values: 1=Professor, 2=Docent, 3=Senior Instructor, 4=Instructor, 5=TA, 6=TA intern, 7=Visiting)"
          schema:
            type: array
            items:
              type: integer
              format: int64
              minimum: 1
              maximum: 7
          example: [1, 2]
        - name: year
          in: query
          required: true
          description: Calendar year (must be >= 2015)
          schema:
            type: integer
            format: int64
            minimum: 2015
          example: 2024
      responses:
        '200':
          description: List of faculty profiles retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllFacultiesResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /academic/getCourse/{id}:
    get:
      tags:
        - Courses
      summary: Get course details by ID
      description: Retrieve detailed information about a specific course instance
      parameters:
        - name: id
          in: path
          required: true
          description: Course instance ID (must be > 0)
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        '200':
          description: Course found and retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCourseResponse'
        '400':
          description: Invalid course ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /academic/getCourseList:
    get:
      tags:
        - Courses
      summary: Get courses with advanced filters
      description: Retrieve a list of courses filtered by academic year, semester, program, institute, and allocation status
      parameters:
        - name: year
          in: query
          required: true
          description: Year of study (1-4 for BS, 1-2 for MS)
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
        - name: academic_year
          in: query
          description: "Academic year IDs (valid values: 1=BS1, 2=BS2, 3=BS3, 4=BS4, 5=MS1, 6=MS2, 7=PhD1, 8=PhD2)"
          schema:
            type: array
            items:
              type: integer
              format: int64
              minimum: 1
              maximum: 8
          example: [1, 2]
        - name: semester_ids
          in: query
          description: "Semester IDs (valid values: 1=T1, 2=T2, 3=T3)"
          schema:
            type: array
            items:
              type: integer
              format: int64
              minimum: 1
              maximum: 3
          example: [1, 2]
        - name: study_program_ids
          in: query
          description: "Study program IDs (valid values: 1-19)"
          schema:
            type: array
            items:
              type: integer
              format: int64
              minimum: 1
              maximum: 19
          example: [1, 5]
        - name: responsible_institute_ids
          in: query
          description: "Responsible institute IDs (valid values: 1=DS, 2=DS/Math, 3=DS/SDE, 4=GAMEDEV, 5=HUM, 6=RO, 7=SDE, 8=SNE)"
          schema:
            type: array
            items:
              type: integer
              format: int64
              minimum: 1
              maximum: 8
          example: [1, 7]
        - name: allocation_not_finished
          in: query
          description: Filter by allocation status
          schema:
            type: boolean
          example: true
        - name: profile_version_id
          in: query
          description: Profile version ID for filtering (must be > 0 if provided)
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        '200':
          description: List of courses retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCourseListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /academic/addNewCourse:
    post:
      tags:
        - Courses
      summary: Add a new course
      description: Create a new course instance with associated programs, tracks, and allocation information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddNewCourseRequest'
            example:
              brief_name: "ML Basics"
              official_name: "Machine Learning Fundamentals"
              academic_year_id: 2
              semester_id: 1
              year: 2
              program_ids: [1, 5]
              track_ids: [3, 5]
              responsible_institute_id: 1
              groups_needed: 3
              is_elective: false
      responses:
        '200':
          description: Course successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddNewCourseResponse'
              example:
                course_id: 1
                brief_name: "ML Basics"
                official_name: "Machine Learning Fundamentals"
                academic_year_name: "BS2"
                semester_name: "T1"
                program_names: ["AI360", "SE"]
                track_names: ["CS", "DS"]
                responsible_institute_name: "DS"
                groups_needed: 3
                pi:
                  allocation_status: "Not Allocated"
                  profile_data: {}
                ti:
                  allocation_status: "Not Allocated"
                  profile_data: {}
                tas: []
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /filter/profile:
    get:
      tags:
        - Filters
      summary: Get faculty profile filters
      description: Retrieve available filter options for faculty profiles (positions and institutes)
      responses:
        '200':
          description: Filters retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFacultyFiltersResponse'
              example:
                institute:
                  - id: 1
                    name: "Институт анализа данных и Искусственного Интеллекта"
                  - id: 2
                    name: "Институт разработки ПО и программной инженерии"
                  - id: 3
                    name: "Институт робототехники и компьютерного зрения"
                  - id: 4
                    name: "Институт информационной безопасности"
                  - id: 5
                    name: "Институт гуманитарных и социальных наук"
                position:
                  - id: 1
                    name: "Professor"
                  - id: 2
                    name: "Docent"
                  - id: 3
                    name: "Senior Instructor"
                  - id: 4
                    name: "Instructor"
                  - id: 5
                    name: "TA"
                  - id: 6
                    name: "TA intern"
                  - id: 7
                    name: "Visiting"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /filter/course:
    get:
      tags:
        - Filters
      summary: Get course filters
      description: Retrieve available filter options for courses (academic years, semesters, programs, institutes, allocation status)
      responses:
        '200':
          description: Filters retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCourseFiltersResponse'
              example:
                allocation_not_finished: [true, false]
                academic_year:
                  - id: 1
                    name: "BS1"
                  - id: 2
                    name: "BS2"
                  - id: 3
                    name: "BS3"
                  - id: 4
                    name: "BS4"
                  - id: 5
                    name: "MS1"
                  - id: 6
                    name: "MS2"
                  - id: 7
                    name: "PhD1"
                  - id: 8
                    name: "PhD2"
                semester:
                  - id: 1
                    name: "T1"
                  - id: 2
                    name: "T2"
                  - id: 3
                    name: "T3"
                study_program:
                  - id: 1
                    name: "AI360"
                  - id: 2
                    name: "МОИИ"
                  - id: 5
                    name: "SE"
                institute:
                  - id: 1
                    name: "DS"
                  - id: 7
                    name: "SDE"
                  - id: 8
                    name: "SNE"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /parsing/parse:
    post:
      tags:
        - Data Parsing
      summary: Parse and import data from Excel file
      description: Upload and parse an Excel file to import course and faculty data
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Excel file to parse (.xlsx)
      responses:
        '200':
          description: File successfully parsed and imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'
        '400':
          description: Invalid file format or parsing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    AddProfileRequest:
      type: object
      required:
        - name_eng
        - position_id
        - institute_id
        - year
      properties:
        name_eng:
          type: string
          description: Faculty member's name in English
          minLength: 1
          example: "John Doe"
        email:
          type: string
          format: email
          description: Faculty member's email (must be unique)
          maxLength: 50
          example: "j.doe@university.edu"
        alias:
          type: string
          description: Faculty member's alias or short name (must be unique)
          example: "jdoe"
        institute_id:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
            maximum: 5
          minItems: 1
          description: |
            List of institute IDs (1-5):
            - 1: Институт анализа данных и Искусственного Интеллекта
            - 2: Институт разработки ПО и программной инженерии
            - 3: Институт робототехники и компьютерного зрения
            - 4: Институт информационной безопасности
            - 5: Институт гуманитарных и социальных наук
          example: [1, 2]
        position_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 7
          description: |
            Position ID (1-7):
            - 1: Professor
            - 2: Docent
            - 3: Senior Instructor
            - 4: Instructor
            - 5: TA
            - 6: TA intern
            - 7: Visiting
          example: 1
        year:
          type: integer
          format: int64
          minimum: 2015
          description: Calendar year (must be >= 2015)
          example: 2024

    AddProfileResponse:
      type: object
      properties:
        profile_id:
          type: integer
          format: int64
          description: Generated profile version ID
        name_eng:
          type: string
        email:
          type: string
        alias:
          type: string
        institute_names:
          type: array
          items:
            type: string
        position_name:
          type: string
        year:
          type: integer
          format: int64

    GetProfileResponse:
      type: object
      properties:
        profile_id:
          type: integer
          format: int64
        year:
          type: integer
          format: int64
        name_eng:
          type: string
        name_ru:
          type: string
          nullable: true
        alias:
          type: string
        email:
          type: string
        position_name:
          type: string
          description: "One of: Professor, Docent, Senior Instructor, Instructor, TA, TA intern, Visiting"
        institute_names:
          type: array
          items:
            type: string
        student_type:
          type: string
          nullable: true
        degree:
          type: boolean
          nullable: true
        fsro:
          type: string
          nullable: true
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageCode'
          nullable: true
        employment_type:
          type: string
          nullable: true
        hiring_status:
          type: string
          nullable: true
        mode:
          type: string
          nullable: true
        max_load:
          type: integer
          format: int64
          nullable: true
        frontal_hours:
          type: integer
          format: int64
          nullable: true
        extra_activities:
          type: number
          format: double
          nullable: true
        workload_stats:
          $ref: '#/components/schemas/WorkloadStats'
          nullable: true

    GetAllFacultiesResponse:
      type: object
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ShortProfile'

    ShortProfile:
      type: object
      properties:
        profile_id:
          type: integer
          format: int64
        name_eng:
          type: string
        alias:
          type: string
        email:
          type: string
        position_name:
          type: string
        institute_names:
          type: array
          items:
            type: string

    AddNewCourseRequest:
      type: object
      required:
        - brief_name
        - academic_year_id
        - semester_id
        - year
        - responsible_institute_id
        - groups_needed
      properties:
        brief_name:
          type: string
          description: Brief name of the course
          maxLength: 100
          example: "ML Basics"
        official_name:
          type: string
          description: Official name of the course
          maxLength: 100
          example: "Machine Learning Fundamentals"
        academic_year_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 8
          description: |
            Academic year ID (1-8):
            - 1: BS1 (Bachelor 1st year)
            - 2: BS2 (Bachelor 2nd year)
            - 3: BS3 (Bachelor 3rd year)
            - 4: BS4 (Bachelor 4th year)
            - 5: MS1 (Master 1st year)
            - 6: MS2 (Master 2nd year)
            - 7: PhD1 (PhD 1st year)
            - 8: PhD2 (PhD 2nd year)
          example: 2
        semester_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 3
          description: |
            Semester ID (1-3):
            - 1: T1 (First trimester)
            - 2: T2 (Second trimester)
            - 3: T3 (Third trimester)
          example: 1
        year:
          type: integer
          format: int64
          minimum: 1
          description: Year of study
          example: 2
        program_ids:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
            maximum: 19
          description: |
            IDs of associated study programs (1-19):
            - 1: AI360, 2: МОИИ, 3: BS RO, 4: AIDE, 5: SE, 6: SNE, 7: ROCV, 8: MSRO, 9: TE,
            - 10: УРКИ, 11: КБ, 12: УнОД, 13: УЦП, 14: DS, 15: R, 16: ITE, 17: ИиВТ, 18: DSAI, 19: CSE
          example: [1, 5]
        track_ids:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
            maximum: 11
          description: |
            IDs of associated tracks (1-11):
            - 1: AAI, 2: AAIR, 3: CS, 4: CSDS, 5: DS, 6: GD, 7: ITE, 8: R, 9: SD, 10: SE, 11: SNE
          example: [3, 5]
        responsible_institute_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 8
          description: |
            ID of the responsible institute (1-8):
            - 1: DS
            - 2: DS/Math
            - 3: DS/SDE
            - 4: GAMEDEV
            - 5: HUM
            - 6: RO
            - 7: SDE
            - 8: SNE
          example: 1
        groups_needed:
          type: integer
          format: int64
          minimum: 1
          description: Number of groups needed for this course
          example: 3
        is_elective:
          type: boolean
          description: Whether the course is elective
          example: false

    AddNewCourseResponse:
      type: object
      properties:
        course_id:
          type: integer
          format: int64
        brief_name:
          type: string
        official_name:
          type: string
        academic_year_name:
          type: string
          description: "One of: BS1, BS2, BS3, BS4, MS1, MS2, PhD1, PhD2"
        semester_name:
          type: string
          description: "One of: T1, T2, T3"
        program_names:
          type: array
          items:
            type: string
        track_names:
          type: array
          items:
            type: string
        responsible_institute_name:
          type: string
          description: "One of: DS, DS/Math, DS/SDE, GAMEDEV, HUM, RO, SDE, SNE"
        groups_needed:
          type: integer
          format: int64
        pi:
          $ref: '#/components/schemas/PI'
        ti:
          $ref: '#/components/schemas/PI'
        tas:
          type: array
          items:
            $ref: '#/components/schemas/Faculty'

    GetCourseResponse:
      type: object
      properties:
        course:
          $ref: '#/components/schemas/Course'

    GetCourseListResponse:
      type: object
      properties:
        courses:
          type: array
          items:
            $ref: '#/components/schemas/Course'

    Course:
      type: object
      properties:
        course_id:
          type: integer
          format: int64
          nullable: true
        brief_name:
          type: string
          nullable: true
        official_name:
          type: string
          nullable: true
        academic_year_name:
          type: string
          nullable: true
          description: "One of: BS1, BS2, BS3, BS4, MS1, MS2, PhD1, PhD2"
        semester_name:
          type: string
          nullable: true
          description: "One of: T1, T2, T3"
        study_program_names:
          type: array
          items:
            type: string
          nullable: true
        responsible_institute_name:
          type: string
          nullable: true
          description: "One of: DS, DS/Math, DS/SDE, GAMEDEV, HUM, RO, SDE, SNE"
        track_names:
          type: array
          items:
            type: string
          nullable: true
        allocation_finished:
          type: boolean
          nullable: true
        mode:
          type: string
          nullable: true
        year:
          type: integer
          format: int64
          nullable: true
        form:
          type: string
          nullable: true
        lecture_hours:
          type: integer
          format: int64
          nullable: true
        lab_hours:
          type: integer
          format: int64
          nullable: true
        groups_needed:
          type: integer
          format: int64
          nullable: true
        groups_taken:
          type: integer
          format: int64
          nullable: true
        pi:
          $ref: '#/components/schemas/PI'
        ti:
          $ref: '#/components/schemas/PI'
        tas:
          type: array
          items:
            $ref: '#/components/schemas/Faculty'

    PI:
      type: object
      description: Principal Investigator or Teacher-in-charge allocation information
      properties:
        allocation_status:
          type: string
          nullable: true
          description: "Allocation status (e.g., 'Not Allocated', 'Allocated', 'Confirmed')"
        profile_data:
          $ref: '#/components/schemas/Faculty'
          nullable: true

    Faculty:
      type: object
      properties:
        profile_id:
          type: integer
          format: int64
        name_eng:
          type: string
          nullable: true
        alias:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        position_name:
          type: string
          nullable: true
          description: "One of: Professor, Docent, Senior Instructor, Instructor, TA, TA intern, Visiting"
        institute_names:
          type: array
          items:
            type: string
        classes:
          type: array
          items:
            type: string
        is_confirmed:
          type: boolean

    GetFacultyFiltersResponse:
      type: object
      properties:
        institute:
          type: array
          items:
            $ref: '#/components/schemas/FilterObject'
          description: |
            Available institutes (IDs 1-5):
            - 1: Институт анализа данных и Искусственного Интеллекта
            - 2: Институт разработки ПО и программной инженерии
            - 3: Институт робототехники и компьютерного зрения
            - 4: Институт информационной безопасности
            - 5: Институт гуманитарных и социальных наук
        position:
          type: array
          items:
            $ref: '#/components/schemas/FilterObject'
          description: |
            Available positions (IDs 1-7):
            - 1: Professor
            - 2: Docent
            - 3: Senior Instructor
            - 4: Instructor
            - 5: TA
            - 6: TA intern
            - 7: Visiting

    GetCourseFiltersResponse:
      type: object
      properties:
        allocation_not_finished:
          type: array
          items:
            type: boolean
          description: "Available allocation status options: [true, false]"
        academic_year:
          type: array
          items:
            $ref: '#/components/schemas/FilterObject'
          description: |
            Available academic years (IDs 1-8):
            - 1: BS1, 2: BS2, 3: BS3, 4: BS4, 5: MS1, 6: MS2, 7: PhD1, 8: PhD2
        semester:
          type: array
          items:
            $ref: '#/components/schemas/FilterObject'
          description: |
            Available semesters (IDs 1-3):
            - 1: T1, 2: T2, 3: T3
        study_program:
          type: array
          items:
            $ref: '#/components/schemas/FilterObject'
          description: |
            Available study programs (IDs 1-19)
        institute:
          type: array
          items:
            $ref: '#/components/schemas/FilterObject'
          description: |
            Available responsible institutes (IDs 1-8):
            - 1: DS, 2: DS/Math, 3: DS/SDE, 4: GAMEDEV, 5: HUM, 6: RO, 7: SDE, 8: SNE

    FilterObject:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    LanguageCode:
      type: object
      properties:
        language_code:
          type: string
          description: "Language code. Valid values: 'en' (English), 'ru' (Russian)"
          enum:
            - en
            - ru
          example: "en"

    WorkloadStats:
      type: object
      description: Faculty workload statistics across three semesters (T1, T2, T3)
      properties:
        T1:
          $ref: '#/components/schemas/ClassesInfo'
        T2:
          $ref: '#/components/schemas/ClassesInfo'
        T3:
          $ref: '#/components/schemas/ClassesInfo'

    ClassesInfo:
      type: object
      description: Class information for a semester
      properties:
        Lec:
          type: integer
          format: int64
          description: Number of lectures
        Tut:
          type: integer
          format: int64
          description: Number of tutorials
        Lab:
          type: integer
          format: int64
          description: Number of lab classes
        Elec:
          type: integer
          format: int64
          description: Number of electives
        Rate:
          type: number
          format: double
          description: Rate or ratio

    ParseResponse:
      type: object
      properties:
        message:
          type: string
          example: "Success"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message

tags:
  - name: Faculty Profile
    description: Operations related to faculty member profiles
  - name: Courses
    description: Operations related to course management
  - name: Filters
    description: Operations to retrieve available filter options
  - name: Data Parsing
    description: Operations for importing data from external sources
